[package]
name = "aml"
version = "0.2.0"
description = "AML — self-hosted writing environment"
authors = ["Bryce Reeves"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "aml_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-log = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
log = "0.4"
thiserror = "2"
notify = "8"
notify-debouncer-full = "0.5"
trash = "5"
tauri-plugin-dialog = "2"
base64 = "0.22"
spellbook = "0.4"
ureq = { version = "3", features = ["json"] }
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
tauri-plugin-updater = "2.11.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
