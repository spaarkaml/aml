name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Syncthing sidecar
        run: pnpm sidecar:fetch

      - name: Rust format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust clippy + tests (also regenerates bindings.ts)
        if: runner.os != 'Windows'
        run: cargo clippy --all-targets -- -D warnings && cargo test
        working-directory: src-tauri

      # The test binary aborts on the hosted Windows runner with STATUS_ENTRYPOINT_NOT_FOUND
      # (a DLL entry-point mismatch when the tauri-linked test exe starts), so Windows
      # compiles the tests but does not run them. Run `cargo test` on the Windows PC by hand;
      # see docs/BACKLOG.md.
      - name: Rust clippy + compile tests (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --all-targets -- -D warnings && cargo test --no-run
        working-directory: src-tauri

      - name: Bindings are current
        run: git diff --exit-code -- src/ipc/bindings.ts
        shell: bash

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Vocabulary
        run: pnpm vocab

      - name: Unit tests
        run: pnpm test

      - name: Contrast report
        run: pnpm contrast

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (shell, browser + mocked IPC)
        run: pnpm e2e
        env:
          CI: "1"

      - name: Build frontend
        run: pnpm build

      - name: Build app bundle (unsigned)
        run: pnpm tauri build --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: aml-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
